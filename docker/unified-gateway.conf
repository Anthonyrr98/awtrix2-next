server {
    listen 7000;
    server_name _;

    location = / {
        return 302 /awtrix-next/;
    }

    location = /awtrix-next {
        return 301 /awtrix-next/;
    }

    location /awtrix-next/ {
        proxy_pass http://bridge:7100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /awtrix-next-integration.js {
        root /usr/share/nginx/html;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }

    location = /pages/next.html {
        proxy_pass http://host:7000/pages/home.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter '</body>' '<script src="/awtrix-next-integration.js"></script></body>';
    }

    location / {
        proxy_pass http://host:7000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        sub_filter_once on;
        sub_filter '</body>' '<script src="/awtrix-next-integration.js"></script></body>';
    }
}
