name: awtrix2-next

services:
  gateway:
    image: awtrix2-next-gateway:bundle
    restart: unless-stopped
    depends_on: [host, bridge]
    ports:
      - "${AWTRIX_UNIFIED_BIND:-0.0.0.0}:${AWTRIX_UNIFIED_PORT:-7000}:7000"

  host:
    image: awtrix2-next-host:bundle
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      JAVA_OPTS: -Xms64m -Xmx768m -XX:+ExitOnOutOfMemoryError
    volumes:
      - host-runtime:/opt/awtrix2
    ports:
      - "${AWTRIX_MATRIX_BIND:-0.0.0.0}:7001:7001"

  bridge:
    image: awtrix2-next-bridge:bundle
    restart: unless-stopped
    depends_on: [host]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PYTHONUNBUFFERED: "1"
      AWTRIX_HOST_URL: http://host:7000
      AWTRIX_HOST_ROOT: /opt/awtrix2
      AWTRIX_NEXT_DATA: /var/lib/awtrix-next
      AWTRIX_GIF_MAX_PLAY_SECONDS: ${GIF_MAX_SECONDS:-120}
    volumes:
      - host-runtime:/opt/awtrix2
      - bridge-data:/var/lib/awtrix-next
    ports:
      - "${AWTRIX_NEXT_BIND:-127.0.0.1}:${AWTRIX_NEXT_PORT:-7100}:7100"

volumes:
  host-runtime:
  bridge-data:

